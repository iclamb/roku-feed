name: Build Notion feed

on:
  # Refresh every 10 minutes (GitHub's minimum cron granularity is 5 min;
  # scheduled runs can be delayed a few minutes under load — that's fine here).
  schedule:
    - cron: "*/10 * * * *"
  # Let you trigger a refresh by hand from the Actions tab.
  workflow_dispatch:
  # Rebuild whenever you push changes to the feed code.
  push:
    branches: [main]

# Required so the workflow can publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't let overlapping runs stomp on each other.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ vars.DATABASE_ID }}
        run: node scripts/fetch-notion.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
