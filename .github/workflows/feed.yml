name: Build Notion feed

on:
  # Refresh every 10 minutes (GitHub minimum cron granularity is 5 min)
  schedule:
    - cron: "*/10 * * * *"

  # Let you trigger a refresh by hand from the Actions tab.
  workflow_dispatch:

  # Rebuild whenever you push changes to the feed code.
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # If you have a package-lock.json and dependencies
      - name: Install deps
        run: npm ci

      - name: Fetch Notion data
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Use ONE of these depending on what you’re exporting:
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
          # NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: node scripts/fetch-notion.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
